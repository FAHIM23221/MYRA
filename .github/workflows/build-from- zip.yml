name: Build APK from uploaded ZIP

on:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-from- zip.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Unzip uploaded source
        run: |
          ZIP=$(ls -t *.zip | head -n 1)
          echo "Using ZIP: $ZIP"
          mkdir -p build-src
          unzip -o "$ZIP" -d build-src
          if [ ! -f build-src/settings.gradle.kts ] && [ ! -f build-src/settings.gradle ]; then
            INNER=$(find build-src -maxdepth 1 -mindepth 1 -type d | head -n 1)
            echo "Wrapper folder found: $INNER"
            mv "$INNER"/* build-src/
          fi
          ls build-src

      - name: Build debug APK
        working-directory: build-src
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-3.0.0-debug-apk
          path: build-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
