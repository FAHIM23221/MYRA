name: Build APK from uploaded ZIP

# Whenever a ZIP file is uploaded to this repo, unzip it, commit the
# extracted source files into the repo itself, and build the APK.
# First-time setup (once): create this file in the repo at
# .github/workflows/build-from-zip.yml — then just upload a source ZIP.

on:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-from- zip.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Unzip uploaded source
        run: |
          ZIP=$(ls -t *.zip | head -n 1)
          echo "Using ZIP: $ZIP"
          mkdir -p build-src
          unzip -o "$ZIP" -d build-src
          # If the ZIP had one wrapper folder, move its contents up
          if [ ! -f build-src/settings.gradle.kts ] && [ ! -f build-src/settings.gradle ]; then
            INNER=$(find build-src -maxdepth 1 -mindepth 1 -type d | head -n 1)
            echo "Wrapper folder found: $INNER"
            mv "$INNER"/* build-src/
          fi
          ls build-src

      - name: Commit extracted source to repo
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp -r build-src/. ./
          rm -rf build-src
          git add -A
          git diff --cached --quiet || git commit -m "Extract MYRA v3.0 source from ZIP"
          git push origin main

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-3.0.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
